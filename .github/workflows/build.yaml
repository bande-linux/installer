name: build

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  workflow_call:
    outputs:
      installer_ver:
        description: unbound-installer built version string
        value: ${{ jobs.build.outputs.installer_ver }}

jobs:
  build:
    runs-on: [self-hosted, unbound]
    outputs:
      installer_ver: ${{ steps.compile.outputs.installer_ver }}

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          fetch-tags: true
          submodules: recursive
          token: ${{ secrets.SUBMODULE_TOKEN }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y libarchive-tools 7zip jq python3-certifi
          rustup target install aarch64-unknown-none-softfloat

      - name: Build unbound-installer
        id: compile
        run: |
          ./build.sh
          echo "installer_ver=$(cat releases/latest).tar.gz" >> $GITHUB_OUTPUT

      - name: Upload artefact
        uses: actions/upload-artifact@v7
        with:
          name: installer-build
          path: |
            releases/*
